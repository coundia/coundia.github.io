<div class="hero container">
  <div class="hero__card chapter-card">
    <p class="badge" data-intro>
      <span class="badge__dot" [class.badge__dot--off]="profile().availability.status === 'unavailable'"></span>
      {{ profile().availability.label }}
    </p>

    <h1 class="display-xl name">
      <span class="line-mask"><span class="name__line" data-intro>{{ profile().firstName }}</span></span>
      <span class="line-mask"><span class="name__line" data-intro>{{ profile().lastName }}</span></span>
    </h1>

    <p class="role h4" data-intro>
      {{ profile().title }}<br />
      <span class="role__stack">{{ profile().headline }}</span>
    </p>

    <p class="chapter-summary tagline" data-intro>{{ profile().tagline }}</p>

    <ul class="tag-list" data-intro>
      @for (item of profile().summaryStrip.slice(0, 3); track item) {
        <li class="tag">{{ item }}</li>
      }
    </ul>

    <div class="ctas" data-intro>
      <a class="btn btn--primary" appMagnetic [routerLink]="home()" fragment="contact"
        >{{ t().hero.cta }} <span class="btn__arrow" aria-hidden="true">→</span></a
      >
      <a class="btn" appMagnetic [routerLink]="cv()">{{ t().hero.cv }}</a>
    </div>
  </div>
</div>
