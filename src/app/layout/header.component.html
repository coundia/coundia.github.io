<div class="bar container">
  <a class="logo" [routerLink]="home()" [attr.aria-label]="t().nav.home" (click)="closeMenu()">PC</a>

  <nav class="nav" [attr.aria-label]="t().nav.menu">
    <ul class="nav__list">
      @for (link of links(); track link.fragment) {
        <li>
          <a class="nav__link" [routerLink]="home()" [fragment]="link.fragment">{{ link.label }}</a>
        </li>
      }
    </ul>
  </nav>

  <div class="actions">
    <a
      class="lang mono"
      [routerLink]="otherLangPath()"
      [attr.hreflang]="otherLang()"
      [attr.lang]="otherLang()"
      [attr.aria-label]="t().nav.language"
      (click)="closeMenu()"
      >{{ t().nav.languageShort }}</a
    >
    <button
      type="button"
      class="icon-btn"
      (click)="theme.toggle()"
      [attr.aria-label]="theme.theme() === 'dark' ? t().nav.themeToLight : t().nav.themeToDark"
    >
      @if (theme.theme() === 'dark') {
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" />
        </svg>
      }
    </button>
    <a class="btn contact" [routerLink]="home()" fragment="contact">{{ t().nav.contact }}</a>
    <button
      type="button"
      class="icon-btn menu-btn"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="mobile-menu"
      (click)="toggleMenu()"
    >
      <span class="visually-hidden">{{ menuOpen() ? t().nav.close : t().nav.menu }}</span>
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        @if (menuOpen()) {
          <path d="M6 6l12 12M18 6L6 18" />
        } @else {
          <path d="M3 7h18M3 12h18M3 17h18" />
        }
      </svg>
    </button>
  </div>
</div>

@if (menuOpen()) {
  <div #panel id="mobile-menu" class="panel">
    <ul class="panel__list container">
      @for (link of links(); track link.fragment) {
        <li class="line-mask">
          <a class="panel__link display-m" [routerLink]="home()" [fragment]="link.fragment" (click)="closeMenu()">{{
            link.label
          }}</a>
        </li>
      }
      <li class="line-mask">
        <a class="panel__link display-m" [routerLink]="home()" fragment="contact" (click)="closeMenu()">{{
          t().nav.contact
        }}</a>
      </li>
    </ul>
  </div>
}
